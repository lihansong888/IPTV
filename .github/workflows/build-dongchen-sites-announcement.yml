name: Build Dongchen With Missing Site Parsers And Final Popup

on:
  push:
    branches: [ Files ]
    paths:
      - '.github/workflows/build-dongchen-sites-announcement.yml'
      - 'dongchen.jar'
      - '最终版.jar'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source JARs
        uses: actions/checkout@v4
        with:
          ref: Files

      - name: Install DEX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsmali-java unzip zip python3

      - name: Extract and disassemble both JARs
        shell: bash
        run: |
          set -euo pipefail
          test -s dongchen.jar
          test -s '最终版.jar'
          mkdir -p work/dongchen work/final work/output
          unzip -q dongchen.jar -d work/dongchen
          unzip -q '最终版.jar' -d work/final
          test -s work/dongchen/classes.dex
          test -s work/final/classes.dex
          BAKSMALI="$(find /usr/share/java -maxdepth 1 -type f -name 'baksmali*.jar' | sort | head -n 1)"
          SMALI="$(find /usr/share/java -maxdepth 1 -type f -name 'smali-[0-9]*.jar' | sort | head -n 1)"
          test -n "$BAKSMALI"
          test -n "$SMALI"
          echo "BAKSMALI=$BAKSMALI" >> "$GITHUB_ENV"
          echo "SMALI=$SMALI" >> "$GITHUB_ENV"
          java -jar "$BAKSMALI" disassemble work/dongchen/classes.dex -o work/dongchen/smali
          java -jar "$BAKSMALI" disassemble work/final/classes.dex -o work/final/smali

      - name: Transplant missing configured site parsers and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import shutil

          final_root = pathlib.Path("work/final/smali")
          target_root = pathlib.Path("work/dongchen/smali")

          # These are the configured API classes absent from dongchen.jar
          # and present in the already-tested final JAR.
          roots = [
              "Lcom/github/catvod/spider/DyGod;",
              "Lcom/github/catvod/spider/AppDrama;",
              "Lcom/github/catvod/spider/Gz360;",
              "Lcom/github/catvod/spider/AppRJ;",
              "Lcom/github/catvod/spider/Web1905;",
              "Lcom/github/catvod/spider/ShortHaokan;",
              "Lcom/github/catvod/spider/ShortXingya;",
              "Lcom/github/catvod/spider/ShortQimao;",
              "Lcom/github/catvod/spider/TingBokan;",
              "Lcom/github/catvod/spider/Kugou;",
              "Lcom/github/catvod/spider/KuKuMusic;",
              "Lcom/github/catvod/spider/Config;",
          ]

          descriptor_re = re.compile(r"^\.class\s+.*?\s+(L[^;]+;)", re.M)
          ref_re = re.compile(r"L[^;]+;")

          def index_classes(root):
              result = {}
              for path in root.rglob("*.smali"):
                  text = path.read_text(encoding="utf-8", errors="replace")
                  match = descriptor_re.search(text)
                  if match:
                      result[match.group(1)] = path
              return result

          final_classes = index_classes(final_root)
          target_classes = index_classes(target_root)

          missing_roots = [item for item in roots if item not in final_classes]
          if missing_roots:
              raise SystemExit("Required parser class missing from final JAR: " + ", ".join(missing_roots))

          queue = list(roots)
          visited = set()
          copied = []
          while queue:
              descriptor = queue.pop()
              if descriptor in visited:
                  continue
              visited.add(descriptor)
              source = final_classes.get(descriptor)
              if source is None:
                  continue

              source_text = source.read_text(encoding="utf-8", errors="replace")
              # The popup is copied separately, byte-for-byte, in the next step.
              if not descriptor.startswith("Lcom/example/popup/") and descriptor not in target_classes:
                  relative = source.relative_to(final_root)
                  destination = target_root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
                  target_classes[descriptor] = destination
                  copied.append(descriptor)

              # Traverse final-JAR references so every missing dependency
              # required by the selected parsers is included. Existing
              # dongchen classes are preserved and never overwritten.
              for reference in ref_re.findall(source_text):
                  if reference in final_classes and reference not in visited:
                      queue.append(reference)

          for root in roots:
              if root not in target_classes:
                  raise SystemExit("Parser was not transplanted: " + root)

          print(f"Configured parser roots: {len(roots)}")
          print(f"Dependency classes examined: {len(visited)}")
          print(f"Missing classes copied from final JAR: {len(copied)}")
          print("Parser roots verified in merged smali:")
          for root in roots:
              print("  " + root)
          PY

      - name: Transplant the exact tested announcement popup
        shell: bash
        run: |
          set -euo pipefail
          FINAL_POPUP='work/final/smali/com/example/popup'
          TARGET_POPUP='work/dongchen/smali/com/example/popup'
          test -s "$FINAL_POPUP/AnnouncementPopup.smali"
          test -s "$FINAL_POPUP/GateHook.smali"
          mkdir -p "$TARGET_POPUP"
          if test -e "$TARGET_POPUP/GateHook.smali"; then
            echo 'Unexpected GateHook already exists in dongchen.'
            exit 1
          fi
          cp "$FINAL_POPUP"/AnnouncementPopup*.smali "$TARGET_POPUP/"
          cp "$FINAL_POPUP/GateHook.smali" "$TARGET_POPUP/"
          find "$TARGET_POPUP" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Add popup initialization call without replacing dongchen Init
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          target = pathlib.Path("work/dongchen/smali/com/github/catvod/spider/Init.smali")
          text = target.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?ms)^\.method[^\n]*\binit\(Landroid/content/Context;\)V\n.*?^\.end method"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"Expected one Init.init(Context), found {len(matches)}")

          block = matches[0].group(0)
          call = "invoke-static {p0}, Lcom/example/popup/GateHook;->run(Landroid/content/Context;)V"
          if call in block:
              raise SystemExit("Popup hook already exists; refusing duplicate injection")

          returns = list(re.finditer(r"(?m)^\s*return-void\s*$", block))
          if len(returns) != 1:
              raise SystemExit(f"Expected one return-void in Init.init(Context), found {len(returns)}")

          pos = returns[0].start()
          block = block[:pos] + "    " + call + "\n" + block[pos:]
          text = text[:matches[0].start()] + block + text[matches[0].end():]
          target.write_text(text, encoding="utf-8")
          print("Inserted popup hook into the original dongchen Init class.")
          PY

      - name: Audit parser entry points and shared helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("work/dongchen/smali/com/github/catvod")
          names = [
              "spider/DyGod.smali", "spider/AppDrama.smali", "spider/Gz360.smali",
              "spider/AppRJ.smali", "spider/Web1905.smali", "spider/ShortHaokan.smali",
              "spider/ShortXingya.smali", "spider/ShortQimao.smali", "spider/TingBokan.smali",
              "spider/Kugou.smali", "spider/KuKuMusic.smali", "spider/Config.smali",
              "spider/xm/Cust.smali", "spider/xm/YH.smali", "spider/xm/YH$1.smali",
              "spider/xm/YH$2.smali", "spider/xm/InitX.smali",
          ]
          for name in names:
              path = root / name
              print(f"\n===== {name} =====")
              if not path.is_file():
                  print("MISSING")
                  continue
              data = path.read_text(encoding="utf-8", errors="replace")
              for line in data.splitlines():
                  stripped = line.strip()
                  if (stripped.startswith(".super ") or stripped.startswith(".implements ")
                      or stripped.startswith(".method ") or stripped.startswith("invoke-")
                      or stripped.startswith("const-string") or stripped.startswith("check-cast")):
                      print(stripped)
          PY

      - name: Audit runtime loader and host framework compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, re

          roots = {
              "dongchen": pathlib.Path("work/dongchen/smali"),
              "final": pathlib.Path("work/final/smali"),
          }
          def index(root):
              out = {}
              for p in root.rglob("*.smali"):
                  data = p.read_bytes()
                  txt = data.decode("utf-8", errors="replace")
                  m = re.search(r"^\\.class\\s+.*?\\s+(L[^;]+;)", txt, re.M)
                  if m:
                      out[m.group(1)] = (p, txt, hashlib.sha256(data).hexdigest())
              return out

          a, b = index(roots["dongchen"]), index(roots["final"])
          print("=== Host framework classes present in both JARs but different ===")
          prefixes = ("Lcom/github/catvod/crawler/", "Lcom/github/catvod/api/", "Lcom/github/catvod/bean/")
          diff = []
          for desc in sorted(set(a) & set(b)):
              if desc.startswith(prefixes) and a[desc][2] != b[desc][2]:
                  diff.append(desc)
          print("DIFFERENT_COUNT", len(diff))
          for desc in diff[:300]:
              print("DIFF", desc)

          print("=== Dynamic parser loader / alias references ===")
          patterns = ("DexClassLoader", "PathClassLoader", "Class;->forName", "loadClass", "csp_", "getDeclaredConstructor", "newInstance")
          for label, root in roots.items():
              print("---", label, "---")
              count = 0
              for p in sorted(root.rglob("*.smali")):
                  txt = p.read_text(encoding="utf-8", errors="replace")
                  hits = [line.strip() for line in txt.splitlines()
                          if any(term in line for term in patterns)]
                  if hits:
                      print("CLASS", p.relative_to(root))
                      for line in hits[:35]:
                          print(line)
                      count += 1
                      if count >= 80:
                          print("TRUNCATED_AT_80_CLASSES")
                          break
          PY

      - name: Deep audit parser compatibility and registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, hashlib

          roots = {"dongchen": pathlib.Path("work/dongchen/smali"),
                   "final": pathlib.Path("work/final/smali")}
          parsers = ["DyGod", "AppDrama", "Gz360", "AppRJ", "Web1905",
                     "ShortHaokan", "ShortXingya", "ShortQimao", "TingBokan",
                     "Kugou", "KuKuMusic", "Config"]

          def index(root):
              out = {}
              for p in root.rglob("*.smali"):
                  data = p.read_bytes()
                  txt = data.decode("utf-8", errors="replace")
                  m = re.search(r"^\.class\s+.*?\s+(L[^;]+;)", txt, re.M)
                  if m:
                      out[m.group(1)] = (p, txt, hashlib.sha256(data).hexdigest())
              return out

          a, b = index(roots["dongchen"]), index(roots["final"])
          print("CLASS_COUNTS", len(a), len(b))
          prefixes = ("Lcom/github/catvod/crawler/", "Lcom/github/catvod/api/",
                      "Lcom/github/catvod/bean/", "Lcom/github/catvod/spider/")
          diffs = [d for d in sorted(set(a) & set(b))
                   if d.startswith(prefixes) and a[d][2] != b[d][2]]
          print("SHARED_FRAMEWORK_AND_SPIDER_DIFFS", len(diffs))
          for d in diffs[:250]:
              print("DIFF", d)

          for label, idx in (("dongchen", a), ("final", b)):
              print("=== SPIDER BASE", label, "===")
              item = idx.get("Lcom/github/catvod/crawler/Spider;")
              if item:
                  for line in item[1].splitlines():
                      if line.strip().startswith((".class", ".super", ".method", ".implements")):
                          print(line.strip())

          for name in parsers:
              d = "Lcom/github/catvod/spider/" + name + ";"
              print("=== PARSER", name, "===")
              item = b.get(d)
              if not item:
                  print("MISSING_FROM_FINAL")
                  continue
              for line in item[1].splitlines():
                  t = line.strip()
                  if t.startswith((".class", ".super", ".implements", ".annotation", ".method")):
                      print(t)
              for m in re.findall(r"invoke-[^ ]+\s+\{[^}]*\},?\s*(Lcom/github/catvod/crawler/[^;]+;->[^ ]+)", item[1]):
                  print("BASE_CALL", m)

          print("=== PARSER NAME STRINGS IN CONFIG/LOADER CLASSES ===")
          needles = set(parsers + ["com.github.catvod.spider.", "csp_"])
          for label, root in roots.items():
              print("---", label, "---")
              count = 0
              for p in sorted(root.rglob("*.smali")):
                  txt = p.read_text(encoding="utf-8", errors="replace")
                  hits = [line.strip() for line in txt.splitlines()
                          if "const-string" in line and any(n in line for n in needles)]
                  if hits:
                      print("CLASS", p.relative_to(root))
                      for line in hits[:80]:
                          print(line)
                      count += 1
                      if count >= 80:
                          print("TRUNCATED")
                          break
          PY

      - name: Inspect dynamic parser class loading and reflective dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          root = pathlib.Path("work/final/smali")
          parser_names = {"DyGod", "AppDrama", "Gz360", "AppRJ", "Web1905",
                          "ShortHaokan", "ShortXingya", "ShortQimao", "TingBokan",
                          "Kugou", "KuKuMusic", "Config"}
          parser_files = [root / "com/github/catvod/spider" / (n + ".smali")
                          for n in sorted(parser_names)]
          print("=== REFLECTION IN PARSER ROOTS ===")
          for p in parser_files:
              if not p.is_file():
                  continue
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [(i, line.strip()) for i, line in enumerate(lines)
                      if any(x in line for x in ("Class;->forName", "ClassLoader;->loadClass",
                                                  "getDeclaredConstructor", "newInstance",
                                                  "const-class"))]
              if hits:
                  print("CLASS", p.name)
                  for i, line in hits:
                      print(f"{i+1}: {line}")
                      for extra in lines[max(0, i-3):min(len(lines), i+4)]:
                          if extra.strip().startswith("const-string"):
                              print("  STRING", extra.strip())

          print("=== REFLECTIVE LOADER IMPLEMENTATIONS ===")
          shown = 0
          for p in sorted(root.rglob("*.smali")):
              if "/merge/" not in str(p):
                  continue
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              if not any("ClassLoader;->loadClass" in x or
                         "Class;->forName" in x for x in lines):
                  continue
              print("===== ", p.relative_to(root), " =====")
              for line in lines[:260]:
                  print(line)
              shown += 1
              if shown >= 12:
                  print("TRUNCATED_AT_12_LOADER_CLASSES")
                  break

          print("=== REQUIRED SUPPORT TYPES USED BY PARSERS ===")
          descriptors = set()
          for p in parser_files:
              if p.is_file():
                  descriptors.update(re.findall(r"Lcom/github/catvod/[^;]+;", p.read_text(encoding="utf-8", errors="replace")))
          for desc in sorted(descriptors):
              rel = pathlib.Path(*desc[1:-1].split("/")).with_suffix(".smali")
              exists = (root / rel).is_file()
              if not exists:
                  print("MISSING_SUPPORT_TYPE", desc)
          PY

      - name: Compare new parser host API calls against original parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          old = pathlib.Path("work/dongchen/smali")
          new = pathlib.Path("work/final/smali")
          names = ["DyGod", "AppDrama", "Gz360", "AppRJ", "Web1905",
                   "ShortHaokan", "ShortXingya", "ShortQimao", "TingBokan",
                   "Kugou", "KuKuMusic", "Config"]
          targets = ("Lcom/github/catvod/crawler/Spider;->",
                     "Lcom/github/catvod/crawler/SpiderDebug;->")

          def refs(text):
              return {m for m in re.findall(r"invoke-[^\n]*?\s+(Lcom/github/catvod/crawler/(?:Spider|SpiderDebug);->[^\s]+)", text)}

          baseline = set()
          baseline_classes = []
          for p in old.rglob("*.smali"):
              t = p.read_text(encoding="utf-8", errors="replace")
              if ".super Lcom/github/catvod/crawler/Spider;" in t:
                  baseline_classes.append(str(p.relative_to(old)))
                  baseline |= refs(t)

          added = set()
          for name in names:
              p = new / "com/github/catvod/spider" / (name + ".smali")
              if p.is_file():
                  added |= refs(p.read_text(encoding="utf-8", errors="replace"))

          print("ORIGINAL_SPIDER_SUBCLASSES", len(baseline_classes))
          print("ORIGINAL_HOST_API_CALLS", len(baseline))
          print("NEW_PARSER_HOST_API_CALLS", len(added))
          print("CALLS_NOT_SEEN_IN_ORIGINAL_PARSERS")
          for item in sorted(added - baseline):
              print("NEW_HOST_CALL", item)
          print("ORIGINAL_PARSER_EXAMPLES")
          for item in baseline_classes[:30]:
              print("ORIGINAL", item)
          PY

      - name: Audit every shared class in parser dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, hashlib, collections

          roots = [
              "Lcom/github/catvod/spider/DyGod;", "Lcom/github/catvod/spider/AppDrama;",
              "Lcom/github/catvod/spider/Gz360;", "Lcom/github/catvod/spider/AppRJ;",
              "Lcom/github/catvod/spider/Web1905;", "Lcom/github/catvod/spider/ShortHaokan;",
              "Lcom/github/catvod/spider/ShortXingya;", "Lcom/github/catvod/spider/ShortQimao;",
              "Lcom/github/catvod/spider/TingBokan;", "Lcom/github/catvod/spider/Kugou;",
              "Lcom/github/catvod/spider/KuKuMusic;", "Lcom/github/catvod/spider/Config;",
          ]
          def index(root):
              out = {}
              for p in root.rglob("*.smali"):
                  data = p.read_bytes()
                  t = data.decode("utf-8", errors="replace")
                  m = re.search(r"^\.class\s+.*?\s+(L[^;]+;)", t, re.M)
                  if m:
                      out[m.group(1)] = (p, t, hashlib.sha256(data).hexdigest())
              return out

          a = index(pathlib.Path("work/dongchen/smali"))
          b = index(pathlib.Path("work/final/smali"))
          queue = list(roots)
          seen = set()
          refs = re.compile(r"L[^;]+;")
          while queue:
              d = queue.pop()
              if d in seen:
                  continue
              seen.add(d)
              item = b.get(d)
              if item:
                  for ref in refs.findall(item[1]):
                      if ref in b and ref not in seen:
                          queue.append(ref)

          changed = [d for d in sorted(seen & set(a) & set(b)) if a[d][2] != b[d][2]]
          groups = collections.Counter(d.split("/")[2] if d.startswith("Lcom/") else d.split("/")[1] for d in changed)
          print("DEPENDENCY_CLOSURE_CLASSES", len(seen))
          print("SHARED_CHANGED_CLASSES_IN_CLOSURE", len(changed))
          print("CHANGED_GROUPS", dict(groups))
          for d in changed[:400]:
              print("CLOSURE_CONFLICT", d)
          print("=== ARCHIVE RESOURCE INVENTORY ===")
          PY
          echo "--- dongchen.jar ---"
          unzip -Z1 dongchen.jar | head -n 250
          echo "--- final.jar ---"
          unzip -Z1 '最终版.jar' | head -n 250

      - name: Inspect Dongchen parser bootstrap and site class loader
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DONGCHEN Init ==="
          cat work/dongchen/smali/com/github/catvod/spider/Init.smali
          echo "=== FINAL Init ==="
          cat work/final/smali/com/github/catvod/spider/Init.smali
          python3 - <<'PY'
          import pathlib
          roots = [("dongchen", pathlib.Path("work/dongchen/smali")),
                   ("final", pathlib.Path("work/final/smali"))]
          terms = ("DexClassLoader", "PathClassLoader", "ClassLoader;->loadClass",
                   "csp_", "com.github.catvod.spider.")
          for label, root in roots:
              print("=== LOADER STRING HITS", label, "===")
              count = 0
              for p in sorted(root.rglob("*.smali")):
                  lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
                  hits = [(i, x.strip()) for i, x in enumerate(lines)
                          if any(term in x for term in terms)]
                  if hits:
                      print("CLASS", p.relative_to(root))
                      for i, x in hits[:60]:
                          print(f"{i+1}: {x}")
                      count += 1
                      if count >= 120:
                          print("TRUNCATED_AT_120_CLASSES")
                          break
          PY

      - name: Inspect custom text helper before cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FULL Cust helper ==="
          cat work/dongchen/smali/com/github/catvod/spider/xm/Cust.smali

      - name: Remove only the injected site branding text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("work/dongchen/smali/com/github/catvod/spider/xm/Cust.smali")
          source = path.read_text(encoding="utf-8")
          # These three constants are injected branding/disclaimer strings.
          source = re.sub(
              r'^\.field static final (?:N|P|P2):Ljava/lang/String; = .*?\n',
              '',
              source,
              flags=re.M,
          )
          # The original helper's fix() adds the injected "高清4K影视专线"
          # suffix to playback-line names. Keep the method/API, but pass the
          # source JSON through unchanged so original site data is preserved.
          replacement = (
              '.method public static fix(Ljava/lang/String;)Ljava/lang/String;\n'
              '    .locals 0\n'
              '    return-object p0\n'
              '.end method'
          )
          source, count = re.subn(
              r'(?ms)^\.method public static fix\(Ljava/lang/String;\)Ljava/lang/String;\n.*?^\.end method',
              lambda _: replacement,
              source,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one Cust.fix method, found {count}")
          if any(token in source for token in (r'\u9ad8\u6e054K\u5f71\u89c6\u4e13\u7ebf', r'\u26d4\u8b66\u544a')):
              raise SystemExit("Injected branding text remains in Cust helper")
          path.write_text(source, encoding="utf-8")
          print("Removed injected branding constants and suffix; preserved helper signatures.")
          PY

      - name: Assemble merged DEX
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$SMALI" assemble work/dongchen/smali -o work/output/classes.dex
          test -s work/output/classes.dex
          echo "Original DEX: $(stat -c %s work/dongchen/classes.dex) bytes"
          echo "Merged DEX:   $(stat -c %s work/output/classes.dex) bytes"

      - name: Build and statically verify separate test JAR
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='dongchen-sites-announcement-test.jar'
          cp dongchen.jar "$OUTPUT"
          zip -q -d "$OUTPUT" classes.dex
          cp work/output/classes.dex classes.dex
          zip -X -q "$OUTPUT" classes.dex
          rm classes.dex
          zip -q -d "$OUTPUT" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/SIG-*' || true
          unzip -t "$OUTPUT"
          mkdir -p work/verify
          unzip -p "$OUTPUT" classes.dex > work/verify/classes.dex
          java -jar "$BAKSMALI" disassemble work/verify/classes.dex -o work/verify/smali
          for parser in DyGod AppDrama Gz360 AppRJ Web1905 ShortHaokan ShortXingya ShortQimao TingBokan Kugou KuKuMusic Config; do
            test -s "work/verify/smali/com/github/catvod/spider/$parser.smali"
          done
          grep -q 'GateHook;->run(Landroid/content/Context;)V' work/verify/smali/com/github/catvod/spider/Init.smali
          grep -q 'AnnouncementPopup;->run(Landroid/content/Context;)V' work/verify/smali/com/example/popup/GateHook.smali
          test -s work/verify/smali/com/example/popup/AnnouncementPopup.smali
          grep -q 'https://lihansong.top/jar/api.php' work/verify/smali/com/example/popup/AnnouncementPopup.smali
          python3 - <<'PY'
          from pathlib import Path
          p = Path("work/verify/smali/com/github/catvod/spider/xm/Cust.smali")
          s = p.read_text(encoding="utf-8")
          assert r'\u9ad8\u6e054K\u5f71\u89c6\u4e13\u7ebf' not in s
          assert r'\u26d4\u8b66\u544a' not in s
          assert '.method public static fix(Ljava/lang/String;)Ljava/lang/String;' in s
          print("Injected site branding cleanup verified.")
          PY
          echo 'Static verification passed.'
          sha256sum dongchen.jar '最终版.jar' "$OUTPUT"

